      - name: Первичная настройка.
        shell: bash
        run: |
          DOCPATH=$TBUILD/tdesktop/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/tdesktop/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "$TBUILD_DRIVE" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: Проверка кеша библиотек.
        id: lookup
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.TBUILD }}\ThirdParty
            ${{ env.TBUILD }}\Libraries
          key: ${{ env.CACHE_PREFIX }}-done-${{ env.CACHE_KEY }}
          lookup-only: true

      - name: Библиотеки готовы?
        if: steps.lookup.outputs.cache-hit != 'true'
        shell: bash
        run: |
          MESSAGE="Библиотеки не собраны за две попытки (подробности в отчётах попыток). Нажмите Re-run all jobs: уже собранное возьмётся из кеша."
          echo "::error::$MESSAGE"
          echo "### $MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

