# Сборка своего Telegram Desktop под Windows x64.
#
# Берёт официальные исходники Telegram Desktop (тег TDESKTOP_REF), накладывает
# встроенный патч с доработками и собирает оптимизированный Telegram.exe.
# Библиотеки собираются один раз и кешируются.
#
# Нужны два секрета репозитория: API_ID и API_HASH (my.telegram.org).

name: Telegram custom build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'

permissions:
  contents: write
  actions: read

concurrency:
  group: telegram-custom-build
  cancel-in-progress: false

env:
  TDESKTOP_REF: v7.2.9
  CACHE_PREFIX: win-x64-rel-v2
  PREPARE_PATH: Telegram/build/prepare/prepare.py

jobs:

  libs:
    name: Библиотеки (попытка ${{ matrix.attempt }})
    runs-on: windows-latest
    timeout-minutes: 355

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        attempt: [1, 2]

    defaults:
      run:
        shell: cmd

    steps:
      - name: Проверка API_ID и API_HASH.
        shell: bash
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          fail() {
            echo "::error::$1"
            echo "### $1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            fail "Не заданы секреты API_ID и API_HASH: Settings -> Secrets and variables -> Actions -> New repository secret."
          fi
          if ! [[ "$API_ID" =~ ^[0-9]+$ ]]; then
            fail "API_ID должен состоять только из цифр."
          fi
          if ! [[ "$API_HASH" =~ ^[0-9a-fA-F]{32}$ ]]; then
            fail "API_HASH должен состоять из 32 символов 0-9 и a-f."
          fi

      - name: Подготовка папок.
        run: |
          set TBUILD_DRIVE=%GITHUB_WORKSPACE:~0,2%
          echo Build tree: %TBUILD_DRIVE%\TBuild
          mkdir %TBUILD_DRIVE%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %TBUILD_DRIVE%\TBuild
          echo TBUILD_DRIVE=%TBUILD_DRIVE%>>%GITHUB_ENV%
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Исходники Telegram Desktop.
        uses: actions/checkout@v7
        with:
          repository: telegramdesktop/tdesktop
          ref: ${{ env.TDESKTOP_REF }}
          path: ${{ env.TBUILD }}\tdesktop

      - name: Исправления подготовки библиотек.
        shell: bash
        run: |
          base64 -d > "$RUNNER_TEMP/prepare.patch" <<'PATCH_EOF'
          ZGlmZiAtLWdpdCBhL1RlbGVncmFtL2J1aWxkL3ByZXBhcmUvcHJlcGFyZS5weSBiL1RlbGVncmFt
          L2J1aWxkL3ByZXBhcmUvcHJlcGFyZS5weQppbmRleCBjNzFkMjkzLi5mZDg5MjcxIDEwMDY0NAot
          LS0gYS9UZWxlZ3JhbS9idWlsZC9wcmVwYXJlL3ByZXBhcmUucHkKKysrIGIvVGVsZWdyYW0vYnVp
          bGQvcHJlcGFyZS9wcmVwYXJlLnB5CkBAIC04Myw3ICs4Myw3IEBAIGlmIG5vdCBvcy5wYXRoLmlz
          ZGlyKG9zLnBhdGguam9pbih0aGlyZFBhcnR5RGlyLCBrZXlzTG9jKSk6CiAgICAgcGF0aGxpYi5Q
          YXRoKG9zLnBhdGguam9pbih0aGlyZFBhcnR5RGlyLCBrZXlzTG9jKSkubWtkaXIocGFyZW50cz1U
          cnVlLCBleGlzdF9vaz1UcnVlKQogCiBwYXRoUHJlZml4ZXMgPSBbCi0gICAgJ1RoaXJkUGFydHlc
          XG1zeXM2NFxcbWluZ3c2NFxcYmluJywKKyAgICAnVGhpcmRQYXJ0eVxcbXN5czY0XFx1Y3J0NjRc
          XGJpbicsCiAgICAgJ1RoaXJkUGFydHlcXGpvbScsCiAgICAgJ1RoaXJkUGFydHlcXGd5cCcsCiBd
          IGlmIHdpbiBlbHNlIFsKQEAgLTQ3MSwxOCArNDcxLDE4IEBAIHdpbjoKICAgICBTRVQgQ0hFUkVf
          SU5WT0tJTkc9ZW5hYmxlZF9mcm9tX2FyZ3VtZW50cwogICAgIFNFVCBNU1lTMl9QQVRIX1RZUEU9
          aW5oZXJpdAogCi0gICAgcG93ZXJzaGVsbCAtQ29tbWFuZCAiaXdyIC1PdXRGaWxlIC4vbXN5czY0
          LmV4ZSBodHRwczovL2dpdGh1Yi5jb20vbXN5czIvbXN5czItaW5zdGFsbGVyL3JlbGVhc2VzL2Rv
          d25sb2FkLzIwMjUtMDgtMzAvbXN5czItYmFzZS14ODZfNjQtMjAyNTA4MzAuc2Z4LmV4ZSIKKyAg
          ICBwb3dlcnNoZWxsIC1Db21tYW5kICJpd3IgLU91dEZpbGUgLi9tc3lzNjQuZXhlIGh0dHBzOi8v
          Z2l0aHViLmNvbS9tc3lzMi9tc3lzMi1pbnN0YWxsZXIvcmVsZWFzZXMvZG93bmxvYWQvMjAyNi0w
          OS0yNy9tc3lzMi1iYXNlLXg4Nl82NC0yMDI2MDkyNy5zZnguZXhlIgogICAgIG1zeXM2NC5leGUK
          ICAgICBkZWwgbXN5czY0LmV4ZQogCiAgICAgYmFzaCAtYyAicGFjbWFuLWtleSAtLWluaXQ7IHBh
          Y21hbi1rZXkgLS1wb3B1bGF0ZTsgcGFjbWFuIC1TeXUgLS1ub2NvbmZpcm0iCiAgICAgcGFjbWFu
          IC1TeXUgLS1ub2NvbmZpcm0gXgogICAgICAgICBtYWtlIF4KLSAgICAgICAgbWluZ3ctdzY0LXg4
          Nl82NC1kaWZmdXRpbHMgXgotICAgICAgICBtaW5ndy13NjQteDg2XzY0LWdwZXJmIF4KLSAgICAg
          ICAgbWluZ3ctdzY0LXg4Nl82NC1uYXNtIF4KLSAgICAgICAgbWluZ3ctdzY0LXg4Nl82NC1wZXJs
          IF4KLSAgICAgICAgbWluZ3ctdzY0LXg4Nl82NC1wa2djb25mCisgICAgICAgIG1pbmd3LXc2NC11
          Y3J0LXg4Nl82NC1kaWZmdXRpbHMgXgorICAgICAgICBtaW5ndy13NjQtdWNydC14ODZfNjQtZ3Bl
          cmYgXgorICAgICAgICBtaW5ndy13NjQtdWNydC14ODZfNjQtbmFzbSBeCisgICAgICAgIG1pbmd3
          LXc2NC11Y3J0LXg4Nl82NC1wZXJsIF4KKyAgICAgICAgbWluZ3ctdzY0LXVjcnQteDg2XzY0LXBr
          Z2NvbmYKICIiIiwgJ1RoaXJkUGFydHknKQogCiBzdGFnZSgncHl0aG9uJywgIiIiCkBAIC0xNDUx
          LDkgKzE0NTEsNiBAQCBkZXBlbmRzOnB5dGhvbi9TY3JpcHRzL2FjdGl2YXRlLmJhdAogICAgIG5p
          bmphIC1DIG91dC9EZWJ1ZyVGb2xkZXJQb3N0Zml4JSBjb21tb24gY3Jhc2hfZ2VuZXJhdGlvbl9j
          bGllbnQgZXhjZXB0aW9uX2hhbmRsZXIKIHJlbGVhc2U6CiAgICAgbmluamEgLUMgb3V0L1JlbGVh
          c2UlRm9sZGVyUG9zdGZpeCUgY29tbW9uIGNyYXNoX2dlbmVyYXRpb25fY2xpZW50IGV4Y2VwdGlv
          bl9oYW5kbGVyCi0gICAgY2QgdG9vbHNcXHdpbmRvd3NcXGR1bXBfc3ltcwotICAgIGd5cCBkdW1w
          X3N5bXMuZ3lwIC0tZm9ybWF0PW1zdnMKLSAgICBtc2J1aWxkIC1tIGR1bXBfc3ltcy52Y3hwcm9q
          IC9wcm9wZXJ0eTpDb25maWd1cmF0aW9uPVJlbGVhc2UgL3Byb3BlcnR5OlBsYXRmb3JtPSJ4NjQi
          ICVUb29sc2V0UHJvcCUKIHdpbjoKICAgICBkZWFjdGl2YXRlCiBtYWM6Cg==
          PATCH_EOF
          git -C "$TBUILD/tdesktop" apply --verbose "$RUNNER_TEMP/prepare.patch" \
            || git -C "$TBUILD/tdesktop" apply --verbose --ignore-whitespace "$RUNNER_TEMP/prepare.patch"

      - name: Первичная настройка.
        shell: bash
        run: |
          DOCPATH=$TBUILD/tdesktop/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/tdesktop/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "$TBUILD_DRIVE" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: Проверка кеша библиотек.
        id: lookup
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.TBUILD }}\ThirdParty
            ${{ env.TBUILD }}\Libraries
          key: ${{ env.CACHE_PREFIX }}-done-${{ env.CACHE_KEY }}
          lookup-only: true

      - name: Освобождение места на диске.
        if: steps.lookup.outputs.cache-hit != 'true' && env.TBUILD_DRIVE == 'C:'
        shell: pwsh
        run: |
          $tools = $env:AGENT_TOOLSDIRECTORY
          $patterns = @(
            'C:\Android',
            'C:\Program Files (x86)\Android',
            'C:\Julia',
            'C:\Miniconda',
            'C:\Program Files\PostgreSQL',
            'C:\Program Files\R',
            'C:\Program Files\Microsoft SQL Server',
            'C:\Program Files (x86)\Epic Games',
            'C:\Program Files (x86)\IIS Express',
            'C:\Program Files (x86)\Inno Setup*',
            'C:\Program Files (x86)\pipx*',
            'C:\SeleniumWebDrivers',
            'C:\selenium',
            'C:\aliyun-cli',
            'C:\cf-cli',
            'C:\tools\Apache*',
            'C:\tools\nginx*',
            'C:\tools\php'
          )
          if ($tools) {
            $patterns += @(
              "$tools\CodeQL",
              "$tools\go",
              "$tools\Java_*_jdk",
              "$tools\Ruby",
              "$tools\stack"
            )
          }
          $jobs = @()
          foreach ($pattern in $patterns) {
            foreach ($item in @(Get-Item -Path $pattern -ErrorAction SilentlyContinue)) {
              Write-Host "Removing $($item.FullName)"
              $jobs += Start-Job -ScriptBlock {
                param($path)
                cmd /c rmdir /s /q "$path" 2>&1 | Out-Null
              } -ArgumentList $item.FullName
            }
          }
          if ($jobs.Count -gt 0) {
            $null = Wait-Job -Job $jobs -Timeout 900
          }
          Get-PSDrive -PSProvider FileSystem -ErrorAction SilentlyContinue | Format-Table Name, Used, Free
          exit 0

      - uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        name: Окружение компилятора MSVC.
        if: steps.lookup.outputs.cache-hit != 'true'
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: Источники NuGet.
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Восстановление незаконченного кеша.
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.TBUILD }}\ThirdParty
            ${{ env.TBUILD }}\Libraries
          key: ${{ env.CACHE_PREFIX }}-done-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-part-${{ env.CACHE_KEY }}-
            ${{ env.CACHE_PREFIX }}-done-
            ${{ env.CACHE_PREFIX }}-part-

      - name: Сборка библиотек (самый долгий шаг, 3-5 часов).
        id: prepare
        if: steps.lookup.outputs.cache-hit != 'true'
        timeout-minutes: 285
        continue-on-error: true
        run: |
          %TBUILD%\tdesktop\Telegram\build\prepare\win.bat silent

      - name: Остановка незавершённых процессов сборки.
        if: always() && steps.lookup.outputs.cache-hit != 'true' && (steps.prepare.outcome == 'failure' || steps.prepare.outcome == 'cancelled')
        run: |
          for %%p in (python.exe cl.exe link.exe lib.exe ml64.exe rc.exe MSBuild.exe ninja.exe jom.exe nmake.exe cmake.exe make.exe sh.exe bash.exe perl.exe nasm.exe git.exe cargo.exe rustc.exe mspdbsrv.exe vctip.exe) do taskkill /F /T /IM %%p >nul 2>&1
          exit /b 0

      - name: Удаление промежуточных файлов.
        if: always() && steps.lookup.outputs.cache-hit != 'true' && steps.prepare.outcome != 'skipped'
        shell: bash
        run: |
          find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete || true

      - name: Сохранение кеша библиотек.
        if: steps.lookup.outputs.cache-hit != 'true' && steps.prepare.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.TBUILD }}\ThirdParty
            ${{ env.TBUILD }}\Libraries
          key: ${{ env.CACHE_PREFIX }}-done-${{ env.CACHE_KEY }}

      - name: Проверка сохранённого кеша.
        id: verify
        if: steps.lookup.outputs.cache-hit != 'true' && steps.prepare.outcome == 'success'
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.TBUILD }}\ThirdParty
            ${{ env.TBUILD }}\Libraries
          key: ${{ env.CACHE_PREFIX }}-done-${{ env.CACHE_KEY }}
          lookup-only: true

      - name: Сохранение незаконченного кеша.
        if: always() && steps.lookup.outputs.cache-hit != 'true' && (steps.prepare.outcome == 'failure' || steps.prepare.outcome == 'cancelled' || (steps.prepare.outcome == 'success' && steps.verify.outputs.cache-hit != 'true'))
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.TBUILD }}\ThirdParty
            ${{ env.TBUILD }}\Libraries
          key: ${{ env.CACHE_PREFIX }}-part-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.attempt }}

      - name: Отчёт.
        if: always()
        shell: bash
        env:
          CACHE_HIT: ${{ steps.lookup.outputs.cache-hit }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          SAVED: ${{ steps.verify.outputs.cache-hit }}
        run: |
          DONE_THIRD="$(ls "$TBUILD/ThirdParty/cache_keys" 2>/dev/null | tr '\n' ' ' || true)"
          DONE_LIBS="$(ls "$LibrariesPath/cache_keys" 2>/dev/null | tr '\n' ' ' || true)"
          FREE="$(df -h "$LibrariesPath" 2>/dev/null | tail -n 1 | awk '{ print $4 }' || true)"
          {
            echo "### Библиотеки, попытка ${{ matrix.attempt }}"
            if [ "$CACHE_HIT" == "true" ]; then
              echo "Готовые библиотеки уже есть в кеше, пересборка не нужна."
            elif [ "$PREPARE_OUTCOME" == "success" ] && [ "$SAVED" == "true" ]; then
              echo "Библиотеки собраны и сохранены в кеш."
            elif [ "$PREPARE_OUTCOME" == "success" ]; then
              echo "Библиотеки собраны, но готовый кеш сохранить не удалось. Продолжение повторит сохранение."
            elif [ -n "$PREPARE_OUTCOME" ] && [ "$PREPARE_OUTCOME" != "skipped" ]; then
              echo "Библиотеки собраны не полностью (итог шага: $PREPARE_OUTCOME). Собранное сохраняется в кеш, продолжение начнёт с этого места."
              echo
              echo "Готовые этапы ThirdParty: ${DONE_THIRD:-нет}"
              echo
              echo "Готовые этапы Libraries: ${DONE_LIBS:-нет}"
              echo
              echo "Свободное место на диске сборки ($TBUILD_DRIVE): $FREE"
            else
              echo "Попытка остановилась до сборки библиотек, подробности в журнале шагов выше."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CACHE_HIT" != "true" ] && [ -n "$PREPARE_OUTCOME" ] && [ "$PREPARE_OUTCOME" != "skipped" ]; then
            if [ "$PREPARE_OUTCOME" == "success" ]; then
              echo "::notice::Попытка ${{ matrix.attempt }}: библиотеки собраны (кеш сохранён: ${SAVED:-нет})."
            else
              echo "::warning::Попытка ${{ matrix.attempt }}: библиотеки не собраны ($PREPARE_OUTCOME). Готово в ThirdParty: ${DONE_THIRD:-нет}; в Libraries: ${DONE_LIBS:-нет}; свободно на $TBUILD_DRIVE $FREE."
            fi
          fi

  build:
    name: Telegram
    needs: libs
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 355

    defaults:
      run:
        shell: cmd

    steps:
      - name: Проверка API_ID и API_HASH.
        shell: bash
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          fail() {
            echo "::error::$1"
            echo "### $1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            fail "Не заданы секреты API_ID и API_HASH: Settings -> Secrets and variables -> Actions -> New repository secret."
          fi
          if ! [[ "$API_ID" =~ ^[0-9]+$ ]]; then
            fail "API_ID должен состоять только из цифр."
          fi
          if ! [[ "$API_HASH" =~ ^[0-9a-fA-F]{32}$ ]]; then
            fail "API_HASH должен состоять из 32 символов 0-9 и a-f."
          fi

      - name: Подготовка папок.
        run: |
          set TBUILD_DRIVE=%GITHUB_WORKSPACE:~0,2%
          echo Build tree: %TBUILD_DRIVE%\TBuild
          mkdir %TBUILD_DRIVE%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %TBUILD_DRIVE%\TBuild
          echo TBUILD_DRIVE=%TBUILD_DRIVE%>>%GITHUB_ENV%
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Исходники Telegram Desktop.
        uses: actions/checkout@v7
        with:
          repository: telegramdesktop/tdesktop
          ref: ${{ env.TDESKTOP_REF }}
          submodules: recursive
          path: ${{ env.TBUILD }}\tdesktop

      - name: Исправления подготовки библиотек.
        shell: bash
        run: |
          base64 -d > "$RUNNER_TEMP/prepare.patch" <<'PATCH_EOF'
          ZGlmZiAtLWdpdCBhL1RlbGVncmFtL2J1aWxkL3ByZXBhcmUvcHJlcGFyZS5weSBiL1RlbGVncmFt
          L2J1aWxkL3ByZXBhcmUvcHJlcGFyZS5weQppbmRleCBjNzFkMjkzLi5mZDg5MjcxIDEwMDY0NAot
          LS0gYS9UZWxlZ3JhbS9idWlsZC9wcmVwYXJlL3ByZXBhcmUucHkKKysrIGIvVGVsZWdyYW0vYnVp
          bGQvcHJlcGFyZS9wcmVwYXJlLnB5CkBAIC04Myw3ICs4Myw3IEBAIGlmIG5vdCBvcy5wYXRoLmlz
          ZGlyKG9zLnBhdGguam9pbih0aGlyZFBhcnR5RGlyLCBrZXlzTG9jKSk6CiAgICAgcGF0aGxpYi5Q
          YXRoKG9zLnBhdGguam9pbih0aGlyZFBhcnR5RGlyLCBrZXlzTG9jKSkubWtkaXIocGFyZW50cz1U
          cnVlLCBleGlzdF9vaz1UcnVlKQogCiBwYXRoUHJlZml4ZXMgPSBbCi0gICAgJ1RoaXJkUGFydHlc
          XG1zeXM2NFxcbWluZ3c2NFxcYmluJywKKyAgICAnVGhpcmRQYXJ0eVxcbXN5czY0XFx1Y3J0NjRc
          XGJpbicsCiAgICAgJ1RoaXJkUGFydHlcXGpvbScsCiAgICAgJ1RoaXJkUGFydHlcXGd5cCcsCiBd
          IGlmIHdpbiBlbHNlIFsKQEAgLTQ3MSwxOCArNDcxLDE4IEBAIHdpbjoKICAgICBTRVQgQ0hFUkVf
          SU5WT0tJTkc9ZW5hYmxlZF9mcm9tX2FyZ3VtZW50cwogICAgIFNFVCBNU1lTMl9QQVRIX1RZUEU9
          aW5oZXJpdAogCi0gICAgcG93ZXJzaGVsbCAtQ29tbWFuZCAiaXdyIC1PdXRGaWxlIC4vbXN5czY0
          LmV4ZSBodHRwczovL2dpdGh1Yi5jb20vbXN5czIvbXN5czItaW5zdGFsbGVyL3JlbGVhc2VzL2Rv
          d25sb2FkLzIwMjUtMDgtMzAvbXN5czItYmFzZS14ODZfNjQtMjAyNTA4MzAuc2Z4LmV4ZSIKKyAg
          ICBwb3dlcnNoZWxsIC1Db21tYW5kICJpd3IgLU91dEZpbGUgLi9tc3lzNjQuZXhlIGh0dHBzOi8v
          Z2l0aHViLmNvbS9tc3lzMi9tc3lzMi1pbnN0YWxsZXIvcmVsZWFzZXMvZG93bmxvYWQvMjAyNi0w
          OS0yNy9tc3lzMi1iYXNlLXg4Nl82NC0yMDI2MDkyNy5zZnguZXhlIgogICAgIG1zeXM2NC5leGUK
          ICAgICBkZWwgbXN5czY0LmV4ZQogCiAgICAgYmFzaCAtYyAicGFjbWFuLWtleSAtLWluaXQ7IHBh
          Y21hbi1rZXkgLS1wb3B1bGF0ZTsgcGFjbWFuIC1TeXUgLS1ub2NvbmZpcm0iCiAgICAgcGFjbWFu
          IC1TeXUgLS1ub2NvbmZpcm0gXgogICAgICAgICBtYWtlIF4KLSAgICAgICAgbWluZ3ctdzY0LXg4
