      - uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        name: Окружение компилятора MSVC.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: Источники NuGet.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Восстановление кеша библиотек.
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.TBUILD }}\ThirdParty
            ${{ env.TBUILD }}\Libraries
          key: ${{ env.CACHE_PREFIX }}-done-${{ env.CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Проверка библиотек.
        run: |
          %TBUILD%\tdesktop\Telegram\build\prepare\win.bat silent

      - name: Удаление промежуточных файлов.
        shell: bash
        run: |
          find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete || true

      - uses: al-cheb/configure-pagefile-action@9b6da52fb72a3c6147c1aad2df22d8d905681adc
        name: Файл подкачки для компилятора.
        continue-on-error: true
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: "D:"

      - name: Конфигурация проекта.
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          cd /d %TBUILD%\tdesktop\Telegram

          call configure.bat ^
          x64 ^
          -D TDESKTOP_API_ID=%API_ID% ^
          -D TDESKTOP_API_HASH=%API_HASH% ^
          -D CMAKE_CONFIGURATION_TYPES=MinSizeRel ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= > "%GITHUB_WORKSPACE%\configure.log" 2>&1

          set CONFIGURE_RESULT=%errorlevel%
          type "%GITHUB_WORKSPACE%\configure.log"
          exit /b %CONFIGURE_RESULT%

      - name: Сборка Telegram (1-2 часа).
        run: |
          cd /d %TBUILD%\tdesktop\Telegram

          cmake --build ..\out --config MinSizeRel --parallel -- /fl "/flp:LogFile=%GITHUB_WORKSPACE%\msbuild-errors.log;ErrorsOnly"
          if not errorlevel 1 exit /b 0

          rem The compiler sometimes runs out of memory on the huge resource files.
          rem The build is incremental, a retry compiles only what is left.
          echo ::warning::First build pass failed, retrying the rest with two compiler processes.
          copy /y "%GITHUB_WORKSPACE%\msbuild-errors.log" "%GITHUB_WORKSPACE%\msbuild-errors-pass1.log" > nul
          set _CL_=/MP2
          cmake --build ..\out --config MinSizeRel --parallel 1 -- /fl "/flp:LogFile=%GITHUB_WORKSPACE%\msbuild-errors.log;ErrorsOnly"
          if not errorlevel 1 exit /b 0

          echo ::warning::Second build pass failed, retrying the rest with one compiler process.
          copy /y "%GITHUB_WORKSPACE%\msbuild-errors.log" "%GITHUB_WORKSPACE%\msbuild-errors-pass2.log" > nul
          set _CL_=/MP1
          cmake --build ..\out --config MinSizeRel --parallel 1 -- /fl "/flp:LogFile=%GITHUB_WORKSPACE%\msbuild-errors.log;ErrorsOnly"

      - name: Архив с результатом.
        env:
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          set OUT=%TBUILD%\tdesktop\out\MinSizeRel
          mkdir artifact
          move %OUT%\Telegram.exe artifact\
          if errorlevel 1 exit /b 1
          7z a -t7z -mx=5 -mhe=on "-p%API_HASH%" Telegram-custom.7z .\artifact\Telegram.exe
          if errorlevel 1 exit /b 1

      - uses: actions/upload-artifact@v7
        name: Загрузка результата.
        with:
          name: Telegram-custom
          path: Telegram-custom.7z
          retention-days: 30

      - name: Публикация в Releases.
        id: release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" Telegram-custom.7z \
            --repo "$GITHUB_REPOSITORY" \
            --title "Telegram ${TDESKTOP_REF} custom, build ${{ github.run_number }}" \
            --notes "Telegram Desktop ${TDESKTOP_REF} + custom features. Archive password: your API_HASH."
          echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_OUTPUT"

      - name: Отчёт.
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          mask() {
            if [ -n "$API_HASH" ] && [ -n "$API_ID" ]; then
              sed -e "s/$API_HASH/***/g" -e "s/$API_ID/***/g"
            else
              cat
            fi
          }
          {
            if [ "$JOB_STATUS" == "success" ]; then
              echo "### Готово: Telegram.exe собран"
              if [ -n "$RELEASE_URL" ]; then
                echo "Скачать: $RELEASE_URL (файл Telegram-custom.7z)."
              else
                echo "Скачать: раздел Artifacts на этой странице (Telegram-custom)."
              fi
              echo
              echo "Пароль архива: ваш API_HASH."
            else
              echo "### Сборка Telegram не удалась"
              if [ -s msbuild-errors.log ]; then
                echo
                echo "Первые ошибки компиляции:"
                echo '```'
                head -n 40 msbuild-errors.log | cut -c1-600 | mask
                echo '```'
              elif [ -s configure.log ]; then
                echo
                echo "Конец журнала конфигурации:"
                echo '```'
                tail -n 40 configure.log | cut -c1-600 | mask
                echo '```'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$JOB_STATUS" == "success" ]; then
            echo "::notice::Telegram.exe собран: ${RELEASE_URL:-раздел Artifacts на этой странице}"
          elif [ -s msbuild-errors.log ]; then
            head -n 6 msbuild-errors.log | tr -d '\r' | cut -c1-500 | mask | sed -e 's/%/%25/g' | while IFS= read -r LINE; do echo "::error::$LINE"; done || true
          elif [ -s configure.log ]; then
            grep -v '^[[:space:]]*$' configure.log | tail -n 6 | tr -d '\r' | cut -c1-500 | mask | sed -e 's/%/%25/g' | while IFS= read -r LINE; do echo "::error::$LINE"; done || true
          fi

      - name: Публикация журнала ошибок.
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LIBS_READY: ${{ steps.lookup.outputs.cache-hit }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          mask() {
            if [ -n "$API_HASH" ] && [ -n "$API_ID" ]; then
              sed -e "s/$API_HASH/***/g" -e "s/$API_ID/***/g"
            else
              cat
            fi
          }
          mkdir -p diag
          if [ "$LIBS_READY" != "true" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=50" --jq '.jobs[] | select(.status == "completed") | .id' | tr -d '\r' | sort -n > diag/jobs.list || true
            INDEX=0
            while IFS= read -r ID <&3; do
              INDEX=$((INDEX + 1))
              if gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$ID/logs" > diag/job.full 2> /dev/null; then
                LINE="$(grep -n -m 1 -e '): FAILED' -e '##\[error\]' diag/job.full | cut -d: -f1 || true)"
                if [ -n "$LINE" ]; then
                  START=$((LINE > 150 ? LINE - 150 : 1))
                  sed -n "${START},$((LINE + 5))p" diag/job.full | tr -d '\r' | cut -c1-600 | mask > "diag/libs-attempt-$INDEX.txt"
                else
                  tail -n 120 diag/job.full | tr -d '\r' | cut -c1-600 | mask > "diag/libs-attempt-$INDEX.txt"
                fi
              fi
              rm -f diag/job.full
            done 3< diag/jobs.list
          fi
          if [ -s msbuild-errors.log ]; then
            head -n 300 msbuild-errors.log | tr -d '\r' | cut -c1-600 | mask > diag/msbuild-errors.txt
          fi
          for PASS in 1 2; do
            if [ -s "msbuild-errors-pass$PASS.log" ]; then
              head -n 300 "msbuild-errors-pass$PASS.log" | tr -d '\r' | cut -c1-600 | mask > "diag/msbuild-errors-pass$PASS.txt"
            fi
          done
          if [ -s configure.log ]; then
            tail -n 200 configure.log | tr -d '\r' | cut -c1-600 | mask > diag/configure.txt
          fi
          rm -f diag/jobs.list
          if ls diag/*.txt > /dev/null 2>&1; then
            TAG="logs-${{ github.run_number }}-${{ github.run_attempt }}"
            gh release create "$TAG" diag/*.txt \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "Build log excerpt, run ${{ github.run_number }}" \
              --notes "Diagnostic excerpt of a failed build. Safe to delete."
            echo "::notice::Журнал ошибок: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          fi
